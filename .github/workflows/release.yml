# Chaque push sur main : compile l'APK et le publie en release GitHub.
# L'app installée compare son versionCode au tag `build-<n>` et propose la mise à jour.
#
# Secret requis (Settings › Secrets and variables › Actions) :
#   KEYSTORE_BASE64 : la clé qui signe l'app (`base64 -w0 ~/.android/debug.keystore`).
#   Sans la même clé, Android refuse d'installer la mise à jour par-dessus l'app existante.
name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

env:
  # Empreinte (publique) du certificat qui signe YouPlay depuis la première version.
  EXPECTED_CERT_SHA256: 104fae1ca60c5904feda9a30d272517d82b89b7b86fe36834f9580178fef5c55

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # numéro de version = nombre de commits

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 manquant : impossible de signer l'APK avec la même clé."
            exit 1
          fi
          ks="$RUNNER_TEMP/youplay.keystore"
          echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$ks"
          # La clé doit être exactement celle des APK déjà installés, sinon Android refuse la mise à jour.
          got=$(LC_ALL=C keytool -J-Duser.language=en -list -v -keystore "$ks" -storepass android -alias androiddebugkey 2>/dev/null \
            | grep -i 'SHA256:' | head -1 | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
          if [ "$got" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Le secret KEYSTORE_BASE64 ne contient pas la bonne clé (empreinte '$got'). Recopie-le avec : base64 -w0 ~/.android/debug.keystore"
            exit 1
          fi
          echo "YOUPLAY_KEYSTORE=$ks" >> "$GITHUB_ENV"

      - name: Numéro de version
        id: v
        run: |
          n=$(git rev-list --count HEAD)
          echo "code=$n" >> "$GITHUB_OUTPUT"
          echo "name=1.0.$n" >> "$GITHUB_OUTPUT"

      - run: flutter pub get

      - name: Compilation
        run: flutter build apk --release --split-per-abi --build-number=${{ steps.v.outputs.code }} --build-name=${{ steps.v.outputs.name }}

      - name: Vérification de la signature
        run: |
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            "$apksigner" verify --print-certs "$f" | grep -q "SHA-256 digest: $EXPECTED_CERT_SHA256" \
              || { echo "::error::$f n'est pas signé avec la clé de YouPlay"; exit 1; }
          done

      - name: Notes de version (titres des commits poussés)
        run: |
          jq -r '.commits[]?.message | split("\n")[0] | "- " + .' "$GITHUB_EVENT_PATH" > notes.md
          [ -s notes.md ] || git log -1 --format='- %s' > notes.md

      # Lu par l'app via releases/latest/download/version.json : pas l'API GitHub, donc pas
      # sa limite de 60 requêtes/heure par adresse IP (vite atteinte sur les réseaux mobiles).
      - name: version.json
        run: |
          apks=$(for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            n=$(basename "$f"); abi=${n#app-}; abi=${abi%-release.apk}
            jq -n --arg abi "$abi" --arg name "$n" --argjson size "$(stat -c%s "$f")" '{($abi): {name: $name, size: $size}}'
          done | jq -s add)
          jq -n \
            --argjson code ${{ steps.v.outputs.code }} \
            --arg name "${{ steps.v.outputs.name }}" \
            --arg tag "build-${{ steps.v.outputs.code }}" \
            --rawfile notes notes.md \
            --argjson apks "$apks" \
            '{versionCode: $code, versionName: $name, tag: $tag, notes: $notes, apks: $apks}' > version.json
          cat version.json

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.v.outputs.code }}
          name: YouPlay ${{ steps.v.outputs.name }}
          body_path: notes.md
          files: |
            build/app/outputs/flutter-apk/app-*-release.apk
            version.json
          make_latest: true
