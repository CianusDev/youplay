# Chaque push sur main : compile l'APK et le publie en release GitHub.
# L'app installée compare son versionCode au tag `build-<n>` et propose la mise à jour.
#
# Secrets requis (Settings › Secrets and variables › Actions) :
#   KEYSTORE_BASE64   : la clé de release (`base64 -w0 ~/.android/youplay-release.jks`).
#   KEYSTORE_PASSWORD : son mot de passe (android/key.properties, ligne password).
#   Sans la même clé, Android refuse d'installer la mise à jour par-dessus l'app existante.
name: Release APK

on:
  push:
    branches: [main]
    # Le site (docs/), les README, la maquette, les scripts et la CI ne changent pas l'app : pas de nouvelle release.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.gitattributes'
      - 'sika-handoff/**'
      # Scripts du dépôt et réglages de la CI : rien ne change dans l'app.
      - 'tools/**'
      - 'fastlane/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

env:
  # Empreinte (publique) du certificat de release de YouPlay (io.github.cianusdev.youplay).
  EXPECTED_CERT_SHA256: df8cbe0c6b83a0faa75b23c9f3efc24cbc840c3d978bd7e068a9ca07df607861

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # numéro de version = nombre de commits

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD manquants : impossible de signer l'APK avec la même clé."
            exit 1
          fi
          ks="$RUNNER_TEMP/youplay.keystore"
          echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$ks"
          # La clé doit être exactement celle des APK déjà installés, sinon Android refuse la mise à jour.
          got=$(LC_ALL=C keytool -J-Duser.language=en -list -v -keystore "$ks" -storepass "$KEYSTORE_PASSWORD" -alias youplay 2>/dev/null \
            | grep -i 'SHA256:' | head -1 | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
          if [ "$got" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Le secret KEYSTORE_BASE64 ne contient pas la bonne clé (empreinte '$got'). Recopie-le avec : base64 -w0 ~/.android/youplay-release.jks"
            exit 1
          fi
          echo "YOUPLAY_KEYSTORE=$ks" >> "$GITHUB_ENV"
          echo "YOUPLAY_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Numéro de version
        id: v
        run: |
          n=$(git rev-list --count HEAD)
          echo "code=$n" >> "$GITHUB_OUTPUT"
          echo "name=1.0.$n" >> "$GITHUB_OUTPUT"

      - run: flutter pub get

      - name: Compilation
        run: flutter build apk --release --split-per-abi --build-number=${{ steps.v.outputs.code }} --build-name=${{ steps.v.outputs.name }}

      - name: Vérification de la signature
        run: |
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            "$apksigner" verify --print-certs "$f" | grep -q "SHA-256 digest: $EXPECTED_CERT_SHA256" \
              || { echo "::error::$f n'est pas signé avec la clé de YouPlay"; exit 1; }
          done

      - name: Notes de version (titres des commits poussés)
        run: |
          jq -r '.commits[]?.message | split("\n")[0] | "- " + .' "$GITHUB_EVENT_PATH" > notes.md
          [ -s notes.md ] || git log -1 --format='- %s' > notes.md

      # Nom lisible pour le site (releases/latest/download/YouPlay.apk) : copie de l'APK arm64-v8a,
      # qui couvre presque tous les téléphones récents. L'app, elle, choisit son APK via version.json.
      - name: YouPlay.apk
        run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk YouPlay.apk

      # Lu par l'app via releases/latest/download/version.json : pas l'API GitHub, donc pas
      # sa limite de 60 requêtes/heure par adresse IP (vite atteinte sur les réseaux mobiles).
      - name: version.json
        run: |
          apks=$(for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            n=$(basename "$f"); abi=${n#app-}; abi=${abi%-release.apk}
            jq -n --arg abi "$abi" --arg name "$n" --argjson size "$(stat -c%s "$f")" '{($abi): {name: $name, size: $size}}'
          done | jq -s add)
          # Identifiant de l'app : l'ancienne YouPlay sait ainsi qu'une version s'installe à côté d'elle.
          appid=$(sed -n 's/.*applicationId = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
          test -n "$appid"
          jq -n \
            --arg appid "$appid" \
            --argjson code ${{ steps.v.outputs.code }} \
            --arg name "${{ steps.v.outputs.name }}" \
            --arg tag "build-${{ steps.v.outputs.code }}" \
            --rawfile notes notes.md \
            --argjson apks "$apks" \
            '{applicationId: $appid, versionCode: $code, versionName: $name, tag: $tag, notes: $notes, apks: $apks}' > version.json
          cat version.json

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.v.outputs.code }}
          name: YouPlay ${{ steps.v.outputs.name }}
          body_path: notes.md
          files: |
            build/app/outputs/flutter-apk/app-*-release.apk
            YouPlay.apk
            version.json
          make_latest: true
