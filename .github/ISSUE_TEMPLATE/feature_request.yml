name: Feature request
description: Suggest an idea for YouPlay
labels: [enhancement]
body:
  - type: textarea
    id: description
    attributes:
      label: Your idea
      description: What would you like YouPlay to do, and why?
    validations:
      required: true
  - type: textarea
    id: device
    attributes:
      label: App and device
      render: text
    validations:
      required: false
