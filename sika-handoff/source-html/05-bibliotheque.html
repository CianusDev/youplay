<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Sika — Bibliothèque</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:#FFD60A}
.scroll::-webkit-scrollbar{display:none}
.cv{position:relative;overflow:hidden;flex-shrink:0}
.cv::before{content:"";position:absolute}
.c1{background:#FFD60A}.c1::before{width:62%;height:62%;left:19%;top:19%;border-radius:50%;background:#141208}
.c2{background:#FF7A1A}.c2::before{width:90%;height:90%;left:-25%;bottom:-45%;border-radius:50%;background:#FFD60A}
.c3{background:#1F3B2D}.c3::before{inset:0;background:repeating-linear-gradient(135deg,#FFD60A 0 8%,transparent 8% 20%)}
.c4{background:#F1E6C8}.c4::before{width:46%;height:46%;right:12%;top:12%;background:#141208}
.c5{background:#3A2A55}.c5::before{width:56%;height:56%;left:22%;top:22%;border-radius:50%;border:5px solid #FFD60A;box-sizing:border-box}
.c6{background:#141208;outline:1px solid #2A271E}.c6::before{width:0;height:0;left:22%;bottom:16%;border-left:16px solid transparent;border-right:16px solid transparent;border-bottom:26px solid #FFD60A}
.chip{font:600 13px Manrope,sans-serif;padding:0 16px;height:36px;border-radius:18px;border:0;cursor:pointer;white-space:nowrap}
.ib{width:44px;height:44px;border:0;background:transparent;color:#F6F3EA;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:22px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;font:600 11px Manrope,sans-serif;color:#A39E8F;min-width:64px;padding:6px 0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0F0E0B; color: #F6F3EA; font-family: Manrope, sans-serif">
<div class="scroll" style="position: absolute; inset: 0; overflow-y: auto; padding: 58px 0 120px; box-sizing: border-box">

<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 20px">
<div style="display: flex; align-items: center; gap: 12px">
<div style="width: 36px; height: 36px; border-radius: 50%; background: #FFD60A; color: #141208; display: flex; align-items: center; justify-content: center; font: 800 14px 'Bricolage Grotesque', sans-serif">K</div>
<h1 style="margin: 0; font: 800 26px 'Bricolage Grotesque', sans-serif; letter-spacing: -0.8px">Bibliothèque</h1>
</div>
<div style="display: flex">
<button class="ib" aria-label="Rechercher dans la bibliothèque"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
<button class="ib" aria-label="Créer une playlist"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
</div>

<div class="scroll" style="display: flex; gap: 8px; padding: 16px 20px 0; overflow-x: auto">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
<sc-if value="{{c.on}}" hint-placeholder-val="{{ false }}"><button class="chip" aria-pressed="true" onClick="{{c.pick}}" style="background: #FFD60A; color: #141208">{{c.label}}</button></sc-if>
<sc-if value="{{c.off}}" hint-placeholder-val="{{ true }}"><button class="chip" aria-pressed="false" onClick="{{c.pick}}" style="background: #24221C; color: #F6F3EA">{{c.label}}</button></sc-if>
</sc-for>
</div>

<a href="Playlist.dc.html" style="margin: 18px 20px 0; display: flex; align-items: center; gap: 14px; background: #1A1915; border: 1.5px solid #FFD60A; border-radius: 18px; padding: 14px">
<div style="width: 52px; height: 52px; border-radius: 14px; background: #FFD60A; color: #141208; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"></path><path d="m7 15 4-4 3 3 6-6"></path></svg>
</div>
<div style="flex: 1"><div style="font-weight: 700; font-size: 15px">Ton mois en musique</div><div style="font-size: 12px; color: #A39E8F; margin-top: 3px">Artistes, genres et minutes d'écoute</div></div>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFD60A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
</a>

<div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 10px 4px 20px">
<button style="display: flex; align-items: center; gap: 8px; border: 0; background: transparent; color: #F6F3EA; font: 700 13px Manrope, sans-serif; height: 44px; padding: 0; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M21 8l-4-4-4 4"></path></svg>Récents
</button>
<button class="ib" aria-label="{{viewLabel}}" onClick="{{toggleView}}">
<sc-if value="{{isList}}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg></sc-if>
<sc-if value="{{isGrid}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg></sc-if>
</button>
</div>

<sc-if value="{{isList}}" hint-placeholder-val="{{ true }}">
<ul style="list-style: none; margin: 0; padding: 0">
<sc-for list="{{items}}" as="it" hint-placeholder-count="7">
<li><a href="Playlist.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 8px 20px">
<div class="cv {{it.cv}}" style="width: 60px; height: 60px; border-radius: {{it.radius}}"></div>
<div style="flex: 1; min-width: 0">
<div style="font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.title}}</div>
<div style="font-size: 12px; color: #A39E8F; margin-top: 4px; display: flex; align-items: center; gap: 6px">
<sc-if value="{{it.pinned}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="#FFD60A" aria-hidden="true"><path d="M15 3l6 6-3 1-4 4 1 5-2 2-4-4-5 5-1-1 5-5-4-4 2-2 5 1 4-4z"></path></svg></sc-if>
<sc-if value="{{it.dl}}" hint-placeholder-val="{{ false }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="#FFD60A" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 7v8M8.5 12 12 15.5 15.5 12" stroke="#141208" stroke-width="2.4" fill="none" stroke-linecap="round"></path></svg></sc-if>
{{it.meta}}</div>
</div>
</a></li>
</sc-for>
</ul>
</sc-if>

<sc-if value="{{isGrid}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding: 8px 20px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="6">
<a href="Playlist.dc.html" style="display: block">
<div class="cv {{it.cv}}" style="width: 100%; aspect-ratio: 1; border-radius: {{it.radius}}"></div>
<div style="font-weight: 700; font-size: 12px; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.title}}</div>
<div style="font-size: 11px; color: #A39E8F; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.kind}}</div>
</a>
</sc-for>
</div>
</sc-if>
</div>

<nav class="nav" aria-label="Navigation principale" style="position: absolute; left: 0; right: 0; bottom: 0; height: 88px; padding: 8px 12px 22px; box-sizing: border-box; display: flex; justify-content: space-around; background: rgba(15,14,11,0.96); border-top: 1px solid #1F1D17">
<a href="Main.dc.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Accueil</a>
<a href="Search.dc.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Recherche</a>
<a href="Library.dc.html" style="color: #FFD60A"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 4v16M9 4v16M14 4l6 16"></path></svg>Bibliothèque</a>
<a href="Downloads.dc.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v8M8.5 12.5 12 16l3.5-3.5"></path></svg>Téléchargés</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { f: 'Tout', grid: false }; }
  renderVals() {
    const all = [
      { title: 'Titres likés', kind: 'Playlist', meta: 'Playlist · 318 titres', cv: 'c1', pinned: true, dl: true },
      { title: 'Lomé by Night', kind: 'Playlist', meta: 'Playlist · Sika', cv: 'c2', pinned: true, dl: false },
      { title: 'Ama Kodjo', kind: 'Artiste', meta: 'Artiste', cv: 'c2', round: true },
      { title: 'Afro Focus', kind: 'Playlist', meta: 'Playlist · Koffi', cv: 'c3', dl: true },
      { title: 'Tech en Afrique', kind: 'Podcast', meta: 'Podcast · [Nom du show]', cv: 'c4' },
      { title: 'Les Lagunes', kind: 'Artiste', meta: 'Artiste', cv: 'c4', round: true },
      { title: 'Harmattan', kind: 'Album', meta: 'Album · Sena Waves', cv: 'c3' },
      { title: 'Code & Chill', kind: 'Playlist', meta: 'Playlist · Koffi', cv: 'c6', dl: true },
      { title: 'Daily Mix 1', kind: 'Playlist', meta: 'Playlist · Sika', cv: 'c5' }
    ];
    const map = { Playlists: 'Playlist', Artistes: 'Artiste', Albums: 'Album', Podcasts: 'Podcast' };
    const f = this.state.f;
    const items = all
      .filter((x) => f === 'Tout' || (f === 'Téléchargés' ? x.dl : x.kind === map[f]))
      .map((x) => ({ ...x, pinned: !!x.pinned, dl: !!x.dl, radius: x.round ? '50%' : '10px' }));
    const chips = ['Tout', 'Playlists', 'Artistes', 'Albums', 'Podcasts', 'Téléchargés'].map((l) => ({
      label: l, on: f === l, off: f !== l, pick: () => this.setState({ f: l })
    }));
    return {
      chips, items,
      isList: !this.state.grid, isGrid: this.state.grid,
      viewLabel: this.state.grid ? 'Afficher en liste' : 'Afficher en grille',
      toggleView: () => this.setState({ grid: !this.state.grid })
    };
  }
}
</script>
</body>
</html>
