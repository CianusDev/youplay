<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Sika — Playlist Lomé by Night</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:#FFD60A}
.scroll::-webkit-scrollbar{display:none}
.cv{position:relative;overflow:hidden;flex-shrink:0}
.cv::before{content:"";position:absolute}
.c1{background:#FFD60A}.c1::before{width:62%;height:62%;left:19%;top:19%;border-radius:50%;background:#141208}
.c2{background:#FF7A1A}.c2::before{width:90%;height:90%;left:-25%;bottom:-45%;border-radius:50%;background:#FFD60A}
.c3{background:#1F3B2D}.c3::before{inset:0;background:repeating-linear-gradient(135deg,#FFD60A 0 8%,transparent 8% 20%)}
.c4{background:#F1E6C8}.c4::before{width:46%;height:46%;right:12%;top:12%;background:#141208}
.c5{background:#3A2A55}.c5::before{width:56%;height:56%;left:22%;top:22%;border-radius:50%;border:4px solid #FFD60A;box-sizing:border-box}
.c6{background:#141208}.c6::before{width:0;height:0;left:22%;bottom:16%;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:20px solid #FFD60A}
.ib{width:44px;height:44px;border:0;background:transparent;color:#F6F3EA;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:22px}
.row{display:flex;align-items:center;gap:12px;padding:8px 20px;width:100%;border:0;background:transparent;color:#F6F3EA;text-align:left;cursor:pointer;font-family:Manrope,sans-serif}
.row:hover{background:#1A1915}
.eq span{display:block;width:3px;background:#FFD60A;border-radius:1px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;font:600 11px Manrope,sans-serif;color:#A39E8F;min-width:64px;padding:6px 0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0F0E0B; color: #F6F3EA; font-family: Manrope, sans-serif">
<div class="scroll" style="position: absolute; inset: 0; overflow-y: auto; padding-bottom: 180px">

<div style="background: #FFD60A; color: #141208; padding: 54px 20px 24px; border-radius: 0 0 32px 32px">
<div style="display: flex; justify-content: space-between; margin: 0 -10px">
<a href="Main.dc.html" class="ib" aria-label="Retour" style="color: #141208"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
<button class="ib" aria-label="Rechercher dans la playlist" style="color: #141208"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
</div>
<div style="display: flex; gap: 18px; align-items: flex-end; margin-top: 8px">
<div class="cv c2" style="width: 148px; height: 148px; border-radius: 18px; box-shadow: 0 18px 36px rgba(20,18,8,0.35)"></div>
<div style="flex: 1; min-width: 0; padding-bottom: 4px">
<div style="font: 700 11px Manrope, sans-serif; letter-spacing: 1.4px; text-transform: uppercase">Playlist</div>
<h1 style="margin: 6px 0 0; font: 800 32px/0.98 'Bricolage Grotesque', sans-serif; letter-spacing: -1px">Lomé by Night</h1>
<div style="font-size: 12px; font-weight: 600; margin-top: 10px">Sika · 42 titres · 2 h 36</div>
</div>
</div>
<p style="margin: 16px 0 0; font-size: 13px; line-height: 1.5; font-weight: 500">Les sons qui font vibrer la plage et les maquis après le coucher du soleil.</p>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 12px 8px 10px">
<div style="display: flex">
<button class="ib" aria-label="Ajouter à la bibliothèque" aria-pressed="{{savedAria}}" onClick="{{toggleSave}}" style="color: {{saveColor}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v8M8 12h8"></path></svg></button>
<button class="ib" aria-label="Télécharger"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v8M8.5 12.5 12 16l3.5-3.5"></path></svg></button>
<button class="ib" aria-label="Partager"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v14"></path></svg></button>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<button class="ib" aria-label="Lecture aléatoire" style="color: #FFD60A"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"></path></svg></button>
<a href="Player.dc.html" aria-label="Lire la playlist" style="width: 60px; height: 60px; border-radius: 30px; background: #FFD60A; color: #141208; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"></path></svg></a>
</div>
</div>

<ol style="list-style: none; margin: 0; padding: 0">
<sc-for list="{{tracks}}" as="t" hint-placeholder-count="8">
<li>
<button class="row" onClick="{{t.pick}}" aria-current="{{t.current}}">
<div style="width: 22px; display: flex; justify-content: center; flex-shrink: 0">
<sc-if value="{{t.on}}" hint-placeholder-val="{{ false }}"><div class="eq" aria-hidden="true" style="display: flex; align-items: flex-end; gap: 2px; height: 14px"><span style="height: 8px"></span><span style="height: 14px"></span><span style="height: 5px"></span><span style="height: 11px"></span></div></sc-if>
<sc-if value="{{t.off}}" hint-placeholder-val="{{ true }}"><span style="font-size: 13px; color: #A39E8F; font-weight: 600">{{t.n}}</span></sc-if>
</div>
<div class="cv {{t.cv}}" style="width: 46px; height: 46px; border-radius: 8px"></div>
<div style="flex: 1; min-width: 0">
<div style="font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: {{t.color}}">{{t.title}}</div>
<div style="font-size: 12px; color: #A39E8F; margin-top: 3px; display: flex; align-items: center; gap: 6px">
<sc-if value="{{t.explicit}}" hint-placeholder-val="{{ false }}"><span style="background: #A39E8F; color: #0F0E0B; font-size: 9px; font-weight: 800; padding: 1px 4px; border-radius: 3px">E</span></sc-if>{{t.artist}}</div>
</div>
<span style="font-size: 12px; color: #A39E8F; font-weight: 600">{{t.dur}}</span>
</button>
</li>
</sc-for>
</ol>
</div>

<div style="position: absolute; left: 8px; right: 8px; bottom: 92px; background: #2A271E; border-radius: 14px; overflow: hidden; box-shadow: 0 12px 30px rgba(0,0,0,0.5)">
<a href="Player.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 8px">
<div class="cv c2" style="width: 44px; height: 44px; border-radius: 8px"></div>
<div style="flex: 1; min-width: 0"><div style="font-weight: 700; font-size: 13px">{{nowTitle}}</div><div style="font-size: 12px; color: #C9C3B3">{{nowArtist}}</div></div>
<span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 22px; background: #FFD60A; color: #141208; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1"></rect><rect x="14" y="4.5" width="4" height="15" rx="1"></rect></svg></span>
</a>
<div style="height: 3px; background: rgba(255,255,255,0.12); margin: 0 10px"><div style="width: 22%; height: 3px; background: #FFD60A"></div></div>
</div>

<nav class="nav" aria-label="Navigation principale" style="position: absolute; left: 0; right: 0; bottom: 0; height: 88px; padding: 8px 12px 22px; box-sizing: border-box; display: flex; justify-content: space-around; background: rgba(15,14,11,0.96); border-top: 1px solid #1F1D17">
<a href="Main.dc.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Accueil</a>
<a href="Search.dc.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Recherche</a>
<a href="Library.dc.html" style="color: #FFD60A"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 4v16M9 4v16M14 4l6 16"></path></svg>Bibliothèque</a>
<a href="Downloads.dc.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v8M8.5 12.5 12 16l3.5-3.5"></path></svg>Téléchargés</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { cur: 1, saved: true }; }
  renderVals() {
    const data = [
      ['Marée haute', 'Sena Waves', '3:12', 'c3', false],
      ['Soleil de Bè', 'Ama Kodjo', '3:41', 'c2', false],
      ['Maquis 228', 'DJ Kpalimé', '4:05', 'c6', true],
      ['Akodessewa', 'Les Lagunes', '3:28', 'c4', false],
      ['Zémidjan Groove', 'Kossi & The Moto', '2:57', 'c1', false],
      ['Nuit à Kégué', 'Ama Kodjo', '3:50', 'c5', false],
      ['Harmattan', 'Sena Waves', '4:22', 'c3', true],
      ['Port Autonome', 'DJ Kpalimé', '3:09', 'c6', false]
    ];
    const tracks = data.map((d, i) => ({
      n: i + 1, title: d[0], artist: d[1], dur: d[2], cv: d[3], explicit: d[4],
      on: this.state.cur === i, off: this.state.cur !== i,
      current: this.state.cur === i ? 'true' : 'false',
      color: this.state.cur === i ? '#FFD60A' : '#F6F3EA',
      pick: () => this.setState({ cur: i })
    }));
    const now = data[this.state.cur];
    return {
      tracks, nowTitle: now[0], nowArtist: now[1],
      savedAria: this.state.saved ? 'true' : 'false',
      saveColor: this.state.saved ? '#FFD60A' : '#F6F3EA',
      toggleSave: () => this.setState({ saved: !this.state.saved })
    };
  }
}
</script>
</body>
</html>
